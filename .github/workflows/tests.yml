# The glasses' Lua: the static checks (check.sh), then every app tested
# on emulated Frame and Halo (tests/, docs/TESTING.md). The screens the
# tests saw are kept as an artifact, for the docs and for a look at what
# a failing test saw.
#
# Runs once for each change: on a pull request that touches the Lua or the
# tests, and again only when it lands on main. A push to any other branch
# runs nothing: its pull request does, and pushing to a branch with one
# open ran the same tests twice. A newer push to a pull request cancels
# its run under way; each commit on main keeps its own.
name: tests

on:
  push:
    branches: [main]
    paths:
      - 'glaz/**'
      - 'apps/**'
      - 'sprites/**'
      - 'flutter-glaz/assets/lua/lib/**'
      - 'flutter-glaz/lib/frame/font.dart'
      - 'tests/**'
      - 'scripts/screenshots.py'
      - 'scripts/check.sh'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'glaz/**'
      - 'apps/**'
      - 'sprites/**'
      - 'flutter-glaz/assets/lua/lib/**'
      - 'flutter-glaz/lib/frame/font.dart'
      - 'tests/**'
      - 'scripts/screenshots.py'
      - 'scripts/check.sh'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lua:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # check.sh wants lua and luac 5.4 by those names
      - name: Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          mkdir -p "$HOME/bin"
          ln -s "$(command -v lua5.4)" "$HOME/bin/lua"
          ln -s "$(command -v luac5.4)" "$HOME/bin/luac"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Static checks
        run: scripts/check.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Apps on emulated Frame and Halo
        env:
          SHOTS: screens
        run: pytest tests apps -q -p no:cacheprovider --junitxml=report.xml

      - name: Screens of every app
        if: always()
        run: python scripts/screenshots.py -o screens/apps

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens
          path: |
            screens
            report.xml
