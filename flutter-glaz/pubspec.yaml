name: glaz
description: "Companion app for glaz, the Frame smart-glasses app"
publish_to: 'none'

# Shown in the About tab too: keep lib/screens/about_screen.dart in step
# (test/version_test.dart checks it).
version: 2.11.0+21

environment:
  sdk: ^3.13.3

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.36.8
  frame_ble: ^3.0.0
  geolocator: ^14.1.1
  http: ^1.6.0
  # photos for the assistant's agent are turned upright with it: models do
  # not read Exif (services/agent_files.dart)
  image: ^4.12.0
  notification_listener_service: ^1.0.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The eye. Generated by tool/logo.py, together with every platform icon.
  assets:
    - assets/logo/logo.png
    # What Upload sends to the glasses. frame_app.lua, app/ and modules/
    # are links to the repository's own files, so the app always carries the
    # Lua it was built next to; lib/ holds the frame_msg libraries.
    - assets/lua/
    - assets/lua/app/
    - assets/lua/modules/
    - assets/lua/lib/
    # The same Lua compiled to bytecode by tool/compile_lua.sh (not
    # committed): the glasses cannot compile main.lua themselves any more.
    - assets/luac/
    # DFU zips for Firmware, fetched by tool/fetch_firmware.sh (not committed)
    - assets/firmware/
