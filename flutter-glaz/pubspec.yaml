name: glaz
description: "Companion app for glaz, the Frame smart-glasses app"
publish_to: 'none'

# Shown in the About tab too: keep lib/screens/about_screen.dart in step
# (test/version_test.dart checks it).
version: 4.12.5+76

environment:
  sdk: ^3.13.3

dependencies:
  audioplayers: ^6.8.1
  dartssh2: ^4.1.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.36.8
  flutter_secure_storage: ^11.2.0
  frame_ble: ^3.0.0
  geolocator: ^14.1.1
  google_mlkit_language_id: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_translation: ^0.15.1
  http: ^1.6.0
  # photos for the assistant's agent are turned upright with it: models do
  # not read Exif (services/agent_files.dart)
  image: ^4.12.0
  notification_listener_service: ^1.0.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  pinenacl: ^0.6.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true

  # The eye. Generated by tool/logo.py, together with every platform icon.
  assets:
    - assets/logo/logo.png
    # What Upload sends to the glasses. glaz/ and apps/
    # are links to the repository's own files, so the app always carries the
    # Lua it was built next to; lib/ holds the frame_msg libraries. apps/
    # links each app's Lua file by file (tool/link_apps.sh), leaving its
    # README, screenshots and tests out. Flutter takes a folder's files but
    # not its subfolders', so every app is listed (test/upload_test.dart
    # holds to both).
    - assets/lua/glaz/
    - assets/lua/apps/about/
    - assets/lua/apps/assistant/
    - assets/lua/apps/battery/
    - assets/lua/apps/bluetooth/
    - assets/lua/apps/brightness/
    - assets/lua/apps/files/
    - assets/lua/apps/firmware/
    - assets/lua/apps/flipper/
    - assets/lua/apps/gemini/
    - assets/lua/apps/notifications/
    - assets/lua/apps/notifyset/
    - assets/lua/apps/photo/
    - assets/lua/apps/reader/
    - assets/lua/apps/recorder/
    - assets/lua/apps/scales/
    - assets/lua/apps/sleep/
    - assets/lua/apps/stopwatch/
    - assets/lua/apps/taptune/
    - assets/lua/apps/term/
    - assets/lua/apps/tilt/
    - assets/lua/apps/timeseries/
    - assets/lua/apps/translate/
    - assets/lua/apps/tuner/
    - assets/lua/apps/uptime/
    - assets/lua/apps/weather/
    - assets/lua/lib/
    # The same Lua compiled to bytecode by tool/compile_lua.sh (not
    # committed): the glasses cannot compile main.lua themselves any more.
    - assets/luac/
    # DFU zips for Firmware, fetched by tool/fetch_firmware.sh (not committed)
    - assets/firmware/
